<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Layla Assessment</title>

<style>

body {

font-family: Arial, sans-serif;

background: #ffe6ee;

display: flex;

justify-content: center;

align-items: center;

height: 100vh;

margin: 0;

}

.card {

background: white;

padding: 40px;

max-width: 600px;

border-radius: 20px;

text-align: center;

box-shadow: 0 10px 25px rgba(0,0,0,.1);

}

button {

background: #ff4d88;

color: white;

border: none;

padding: 12px 24px;

border-radius: 10px;

cursor: pointer;

font-size: 16px;

}

</style>

</head>

<body>

<div class="card" id="card">

<h1>❤️ Welcome, Layla.</h1>

<p>Kareem is attempting to plan a date.</p>

<p>

Please assist in diagnosing your ideal day so the

appropriate treatment plan can be developed.

</p>

<p><strong>Expected Outcome</strong></p>

<p>✓ Good food</p>

<p>✓ Good company</p>

<p>✓ A break from CRNA school</p>

<p>✓ Minimal exposure to Houston</p>

<button onclick="startAssessment()">

Begin Assessment

</button>

</div>

<script>

function startAssessment() {

var messages = [

"Reviewing clinical data...",

"Sending information to local database...",

"Consulting Beaumont hospitals for further assessment...",

"Administering therapeutic matcha...",

"Verifying Houston avoidance preferences...",

"Checking whether country is a diagnosable condition...",

"Generating treatment plan..."

];

var card = document.getElementById("card");

card.innerHTML = "<h2 id='loading'>Loading...</h2>";

var i = 0;

var interval = setInterval(function() {

document.getElementById("loading").innerText =

messages[i];

i++;

if (i >= messages.length) {

clearInterval(interval);

setTimeout(function() {

card.innerHTML = `

<h2>Chief Complaint</h2>

<p>What are you currently in need of most?</p>

<label><input type="checkbox"> Good food</label><br><br>

<label><input type="checkbox"> Fresh air</label><br><br>

<label><input type="checkbox"> Matcha</label><br><br>

<label><input type="checkbox"> A break from studying</label><br><br>

<label><input type="checkbox"> Adventure</label>
<br><br>

<button onclick= "showScheduling()">
Next →
</button>
`;
}, 1000);

}

}, 1500);

}
function showScheduling() {

document.getElementById("card").innerHTML = `

<h2>Scheduling Assessment</h2>

<p>

When can Kareem steal a few hours of your time?

</p>

<label>

<input type="radio" name="day">

Friday

</label>

<br><br>

<label>

<input type="radio" name="day">

Saturday

</label>

<br><br>

<label>

<input type="radio" name="day">

Sunday

</label>

<br><br>

<label>

<input type="radio" name="day">

Next available appointment

</label>

<br><br>

<button>

Next →

</button>

`;

}
</script>

</body>

</html>
